<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" aria-labelledby="title desc" role="img" viewBox="0 0 1280 640"><title id="title">pi-fusion</title><desc id="desc">Several models run in parallel, critics evaluate plans, then one synthesizes the answer.</desc><style>text{font-family:&apos;Inter&apos;,system-ui,-apple-system,&apos;Segoe UI&apos;,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.kicker{font-size:22px;font-weight:600;fill:#6e7268;letter-spacing:4px}.title{font-size:116px;font-weight:800;fill:#16301f;letter-spacing:-3px}.sub{font-size:33px;font-weight:600;fill:#6e7268}.small{font-size:23px;font-weight:500;fill:#8b8f86}.blockTitle{fill:#eef3ea;font-weight:700}.blockSub{fill:rgba(238,243,234,.72);font-size:16px;font-weight:500}.outlineTitle{fill:#0e481f;font-weight:700}.outlineSub{fill:#6e7268;font-size:16px;font-weight:500}.pillText{fill:#16301f;font-size:22px;font-weight:600}.edge,.edgeFaint{fill:none;stroke:#0e481f;stroke-width:2.5;stroke-linecap:round;opacity:.9}.edgeFaint{stroke-width:1.6;opacity:.32}.wordmark{fill:#6e7268;font-size:24px;font-weight:600;letter-spacing:.3px}</style><rect width="1280" height="640" fill="#ECEBE6"/><text x="88" y="214" class="kicker mono">COMPOUND AI · FOR PI</text><text x="84" y="320" class="title">pi-fusion</text><text x="90" y="384" class="sub">several models, in parallel</text><text x="90" y="430" class="small">one synthesized answer</text><path d="M1000 150 C1000 190, 858 190, 858 230" class="edge"/><path d="M1000 150 C1000 190, 1142 190, 1142 230" class="edge"/><path d="M858 290 C858 320, 838 320, 838 350" class="edgeFaint"/><path d="M858 290 C858 320, 1000 320, 1000 350" class="edgeFaint"/><path d="M858 290 C858 320, 1162 320, 1162 350" class="edgeFaint"/><path d="M1142 290 C1142 320, 838 320, 838 350" class="edgeFaint"/><path d="M1142 290 C1142 320, 1000 320, 1000 350" class="edgeFaint"/><path d="M1142 290 C1142 320, 1162 320, 1162 350" class="edgeFaint"/><path d="M838 420 C838 440, 920 440, 920 460" class="edgeFaint"/><path d="M1000 420 C1000 440, 920 440, 920 460" class="edgeFaint"/><path d="M1162 420 C1162 440, 920 440, 920 460" class="edgeFaint"/><path d="M838 420 C838 440, 1080 440, 1080 460" class="edgeFaint"/><path d="M1000 420 C1000 440, 1080 440, 1080 460" class="edgeFaint"/><path d="M1162 420 C1162 440, 1080 440, 1080 460" class="edgeFaint"/><path d="M920 515 C920 535, 1000 535, 1000 550" class="edge"/><path d="M1080 515 C1080 535, 1000 535, 1000 550" class="edge"/><path d="M800 420 C800 490, 795 510, 795 550" class="edge"/><path d="M1200 420 C1200 490, 1205 510, 1205 550" class="edge"/><path d="M772 290 C668 390, 668 490, 762 570" class="edge"/><rect width="224" height="56" x="888" y="94" fill="#E3E2DC" stroke="#C7C7C0" stroke-width="2" rx="28"/><text x="1000" y="130" class="pillText" text-anchor="middle">Your prompt</text><rect width="260" height="60" x="728" y="230" fill="rgba(14,72,31,0.09)" stroke="#0E481F" stroke-width="2.5" rx="12"/><text x="858" y="262" class="outlineTitle" font-size="23" text-anchor="middle">Discovery<tspan dy="-8" font-size="15">*</tspan></text><text x="858" y="280" class="outlineSub" text-anchor="middle">loads context once</text><rect width="260" height="60" x="1012" y="230" fill="rgba(14,72,31,0.09)" stroke="#0E481F" stroke-width="2.5" rx="12"/><text x="1142" y="262" class="outlineTitle" font-size="23" text-anchor="middle">Prompt rewrite<tspan dy="-8" font-size="15">*</tspan></text><text x="1142" y="280" class="outlineSub" text-anchor="middle">varies the angle</text><rect width="150" height="70" x="763" y="350" fill="#0E481F" rx="12"/><text x="838" y="382" class="blockTitle" font-size="22" text-anchor="middle">Worker</text><text x="838" y="404" class="blockSub" text-anchor="middle">angle 1</text><rect width="150" height="70" x="925" y="350" fill="#0E481F" rx="12"/><text x="1000" y="382" class="blockTitle" font-size="22" text-anchor="middle">Worker</text><text x="1000" y="404" class="blockSub" text-anchor="middle">angle 2</text><rect width="150" height="70" x="1087" y="350" fill="#0E481F" rx="12"/><text x="1162" y="382" class="blockTitle" font-size="22" text-anchor="middle">Worker</text><text x="1162" y="404" class="blockSub" text-anchor="middle">angle 3</text><rect width="150" height="55" x="845" y="460" fill="rgba(14,72,31,0.09)" stroke="#0E481F" stroke-width="2.5" rx="12"/><text x="920" y="488" class="outlineTitle" font-size="20" text-anchor="middle">Critic #1<tspan dy="-6" font-size="13">*</tspan></text><text x="920" y="504" class="outlineSub" text-anchor="middle">correctness</text><rect width="150" height="55" x="1005" y="460" fill="rgba(14,72,31,0.09)" stroke="#0E481F" stroke-width="2.5" rx="12"/><text x="1080" y="488" class="outlineTitle" font-size="20" text-anchor="middle">Critic #2<tspan dy="-6" font-size="13">*</tspan></text><text x="1080" y="504" class="outlineSub" text-anchor="middle">risk</text><rect width="480" height="55" x="760" y="550" fill="#0E481F" rx="12"/><text x="1000" y="586" class="blockTitle" font-size="24" text-anchor="middle">Synthesis · one final answer</text><text x="1000" y="628" fill="#8B8F86" font-size="16" font-weight="500" text-anchor="middle">* Optional step</text><circle cx="100" cy="556" r="22" fill="none" stroke="#0E481F" stroke-width="4.5"/><text x="100" y="566" fill="#0E481F" class="mono" font-size="34" font-weight="700" text-anchor="middle">∪</text><text x="134" y="565" class="wordmark mono">pi-fusion</text></svg>